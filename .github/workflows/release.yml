name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # Bun cross-compiles every target from a single host, so there's no need
      # for per-OS runners (the macOS Intel runner queue was the bottleneck).
      - name: Build binaries
        run: |
          for spec in darwin-arm64:loom-macos-arm64 darwin-x64:loom-macos-x86_64 linux-x64:loom-linux-x86_64; do
            target="bun-${spec%%:*}"
            artifact="${spec##*:}"
            bun build --compile --target="$target" ./src/cli.ts --outfile loom
            tar czf "$artifact.tar.gz" loom
            rm loom
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true

      - name: Dispatch to homebrew-tap
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: karbassi/homebrew-tap
          event-type: release
          client-payload: '{"formula": "loom"}'
